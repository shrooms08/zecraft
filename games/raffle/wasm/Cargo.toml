[package]
name = "zecraft-raffle-wasm"
version = "0.1.0"
description = "The raffle in the browser: the five round checks (zecraft-verify, Halo2 included) and sealed ZRFL entry requests, for wasm32 on the stable toolchain"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
zecraft-core = { path = "../../../crates/zecraft-core" }
zecraft-verify = { path = "../../../crates/zecraft-verify" }
zecraft-raffle = { path = "../rules" }
zcash_client_backend = { version = "0.24.0", default-features = false, features = ["orchard"] }
prost = "0.14"
serde.workspace = true
serde_json.workspace = true
rand_chacha_09 = { package = "rand_chacha", version = "0.9.0", default-features = false }
wasm-bindgen = "=0.2.128"
js-sys = "0.3.105"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Seeds the sealing RNG and lets halo2/rand_core 0.6 draw randomness through
# the Web Crypto API.
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.2"

[package.metadata.wasm-pack.profile.release]
# binaryen is not installed here; the size is reported unoptimised.
wasm-opt = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(zcash_unstable, values("nu7"))'] }
