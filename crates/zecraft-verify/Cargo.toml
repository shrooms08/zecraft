[package]
name = "zecraft-verify"
version = "0.1.0"
description = "Independent verifier for Zecraft rounds and win proofs, generic over a game's Rules (native and wasm32; the cli feature talks to any lightwalletd)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
zecraft-core = { path = "../zecraft-core" }
# No `multicore`: the verifier also builds for wasm32 without atomics (stable
# toolchain, single-threaded). Native builds get multicore from the server crates.
orchard = { version = "0.15.5", default-features = false, features = ["circuit", "std"] }
pasta_curves.workspace = true
zcash_primitives = { version = "0.30.1", default-features = false, features = ["std", "circuits"] }
zcash_protocol.workspace = true
zcash_note_encryption = "0.4.1"
zcash_keys = { version = "0.16.1", default-features = false, features = ["orchard"] }
zcash_client_backend = { version = "0.24.0", default-features = false, features = ["orchard"] }
incrementalmerkletree = "0.8.2"
nonempty = "0.11"
prost = "0.14"
blake2b_simd = "1"
rand_core.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard.workspace = true
base64.workspace = true
hex.workspace = true
thiserror.workspace = true

# CLI only (native): gRPC to any lightwalletd, HTTP to the engine, the relay server.
tokio = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[features]
cli = [
    "dep:tokio", "dep:clap", "dep:anyhow", "dep:tonic", "dep:reqwest", "dep:axum",
    "dep:tower-http", "dep:tracing", "dep:tracing-subscriber",
    "zcash_client_backend/lightwalletd-tonic-transport",
    "zcash_client_backend/lightwalletd-tonic-tls-webpki-roots",
]


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(zcash_unstable, values("nu7"))'] }
