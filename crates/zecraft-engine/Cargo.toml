[package]
name = "zecraft-engine"
version = "0.1.0"
description = "Zecraft round server: follows the chain, detects entries with the vault's incoming viewing key, settles rounds with a game's Rules, coordinates payouts, serves the board"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
zecraft-core = { path = "../zecraft-core" }
zecraft-verify = { path = "../zecraft-verify" }
base64.workspace = true
sha2 = { workspace = true, features = ["std"] }
zecraft-vault = { path = "../zecraft-vault" }

orchard.workspace = true
zcash_client_backend.workspace = true
zcash_client_sqlite.workspace = true
zcash_keys.workspace = true
zcash_note_encryption = "0.4.1"
zcash_primitives.workspace = true
zcash_protocol.workspace = true
zcash_address.workspace = true

rusqlite.workspace = true
tokio = { workspace = true, features = ["sync", "time", "signal", "net"] }
tonic.workspace = true
prost = "0.14"
async-trait.workspace = true
axum.workspace = true
tower-http.workspace = true
reqwest.workspace = true
ed25519-dalek.workspace = true
postcard.workspace = true
rand_core.workspace = true
rand_09.workspace = true
pczt.workspace = true
pasta_curves.workspace = true
zip321.workspace = true

serde.workspace = true
serde_json.workspace = true
hex.workspace = true
thiserror.workspace = true
anyhow.workspace = true
clap.workspace = true
dotenvy.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true

rand_08 = { workspace = true, optional = true }

[features]
# Synthetic chains and in-memory vaults for tests (`crate::synthetic`).
testkit = ["dep:rand_08"]
# Demonstration only: lets the coordinator tamper one payout so keyholders can be
# seen refusing it. Never enabled in normal builds.
rogue-demo = []

[dev-dependencies]
zecraft-engine = { path = ".", features = ["testkit"] }
# The kit's example game: the engine's tests run real rounds of it.
zecraft-raffle = { path = "../../games/raffle/rules" }
proptest = ">=1.6, <1.7"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# The pinned librustzcash crates gate NU7 behind this cfg (set in .cargo/config.toml).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(zcash_unstable, values("nu7"))'] }
